<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Flask 一頁式網站</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        .badge {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #1e1b4b;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p.subtitle {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        #clickMessage {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #059669;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🚀 Python Flask</div>
        <h1>Hello, World!</h1>
        <p class="subtitle">這是一個使用 Python Flask 框架所建立的現代化一頁式網站。</p>
        
        <div class="info-box">
            <div><strong>伺服器渲染時間：</strong></div>
            <div>{{ current_time }}</div>
        </div>

        <button class="btn" onclick="handleClick()">點擊互動</button>
        <div id="clickMessage">🎉 恭喜！你的 Flask 網站運作正常！</div>

        <div class="footer">
            Powered by Flask & Jinja2 Template
        </div>
    </div>

    <script>
        function handleClick() {
            const msg = document.getElementById('clickMessage');
            msg.style.opacity = '1';
        }
    </script>
</body>
</html>
