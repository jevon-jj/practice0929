name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==============================
  # 1. CI: 測試與代碼檢查
  # ==============================
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 下載專案代碼 (Checkout)
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: 安裝依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行單元測試
      run: |
        python -m unittest discover tests

  # ==============================
  # 2. CD: 自動部署至 Render
  # ==============================
  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: 觸發 Render Deploy Hook
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK" ]; then
          echo "⚠️ 尚未設定 RENDER_DEPLOY_HOOK_URL Secret。如果 Render 已開啟 Auto-Deploy，Render 會自動透過 GitHub 觸發部署。"
        else
          echo "🚀 正在觸發 Render 自動部署..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK"
          echo "✅ 部署請求已成功發送至 Render！"
        fi
